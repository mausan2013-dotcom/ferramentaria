<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#021a30" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Ferramentaria</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Visual inspirado no padrão da empresa (rumolog.com): azul-marinho #043865, azul-claro #32a6e6,
   fundo cinza-azulado, Open Sans, cantos pouco arredondados e blocos com canto cortado. */
:root {
  --bg: #ebf0f2; --card: #ffffff; --ink: #2b3a48; --title: #043865; --muted: #5f7180; --line: #d3dde3;
  --bar: #ffffff; --bar-ink: #043865;
  --primary: #043865; --primary-ink: #ffffff;   /* botões principais */
  --accent: #32a6e6; --accent-ink: #ffffff;     /* destaques, seleção, progresso */
  --ok: #138a6c; --ok-bg: #e1f4ee; --bad: #c62828; --bad-bg: #fdeaea; --warn: #c45a12; --warn-bg: #fff0e5;
  --toast: #043865;
  --radius: 6px; --radius-sm: 4px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #021a30; --card: #06294a; --ink: #e6eef5; --title: #ffffff; --muted: #9db3c6; --line: #16416a;
    --bar: #06294a; --bar-ink: #ffffff;
    --primary: #32a6e6; --primary-ink: #021a30;
    --ok: #4fd1a8; --ok-bg: #0c3a33; --bad: #ff7272; --bad-bg: #3d1a24; --warn: #f7a26b; --warn-bg: #3d2a1c;
    --toast: #32a6e6;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Open Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; }
header.top h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 800; letter-spacing: .1px; }
header.top .sub { font-size: 12px; color: var(--muted); font-weight: 600; display: block; text-transform: uppercase; letter-spacing: .5px; }
header.top .sinc { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: var(--bg); color: var(--title); border: 1px solid var(--line); white-space: nowrap; }
header.top .sinc.offline, header.top .sinc.erro { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
header.top button { background: none; border: 0; color: inherit; font-size: 26px; padding: 0 6px 0 0; line-height: 1; }
main { padding: 14px 16px; max-width: 720px; margin: 0 auto; }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs a { flex: 1; text-align: center; padding: 9px 2px 10px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; border-top: 3px solid transparent; margin-top: -1px; }
nav.tabs a svg { display: block; margin: 0 auto 3px; width: 24px; height: 24px; }
nav.tabs a.on { color: var(--title); border-top-color: var(--accent); }
nav.tabs a.on svg { color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 14px; margin: 0 0 10px; color: var(--title); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--card); color: var(--title); font: inherit; font-weight: 700; cursor: pointer; }
.btn.big { width: 100%; min-height: 60px; font-size: 18px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.status { border-radius: 0; padding: 18px 18px 26px; margin-bottom: 12px; border: 0; border-left: 6px solid var(--line);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px)); }  /* canto cortado */
.status.ok { background: var(--ok-bg); border-left-color: var(--ok); }
.status.bad { background: var(--bad-bg); border-left-color: var(--bad); }
.status.neutral { background: #32a6e6; color: #043865; border-left-color: #043865; }  /* bloco azul-claro com texto marinho, como no site */
.status.neutral .muted { color: #043865; }
.status .big { color: var(--title); }
.status.neutral .big { color: #043865; }
.status .big { font-size: 22px; font-weight: 800; }
.status.ok .big { color: var(--ok); } .status.bad .big { color: var(--bad); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.kpi b { display: block; font-size: 26px; font-weight: 800; color: var(--title); }
.kpi span { font-size: 12px; color: var(--muted); }
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; min-height: 48px; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
.li:first-child { border-top: 0; }
.li .t { font-weight: 700; color: var(--title); }
.li .s { font-size: 13px; color: var(--muted); }
.group-h { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--title); margin: 18px 4px 6px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.tag.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.tag.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.qty { font-size: 22px; font-weight: 800; color: var(--title); min-width: 44px; text-align: right; }
/* Linha de contagem */
.cnt { padding: 12px 14px; border-top: 1px solid var(--line); }
.cnt:first-child { border-top: 0; }
.cnt.dif { background: var(--bad-bg); }
.cnt .s { font-size: 13px; color: var(--muted); }
.cnt .top { display: flex; gap: 8px; align-items: flex-start; }
.cnt .ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.cnt .ctl button { width: 56px; height: 56px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg); color: var(--title); font-size: 28px; font-weight: 700; }
.cnt .ctl input { width: 76px; text-align: center; font-size: 24px; font-weight: 800; height: 56px; padding: 0; }
.cnt .ctl .same { height: 56px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px dashed var(--line); background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; }
.sticky-foot { position: sticky; bottom: calc(68px + env(safe-area-inset-bottom)); background: var(--bg); padding: 10px 0 4px; }
.progress { height: 6px; background: var(--line); border-radius: 0; overflow: hidden; margin: 6px 0 2px; }
.progress i { display: block; height: 100%; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chips button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 14px; }
.chips button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
dialog { border: 0; border-top: 5px solid var(--accent); border-radius: var(--radius); padding: 0; width: min(560px, calc(100% - 24px)); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog .dh { padding: 16px 16px 0; font-size: 18px; font-weight: 800; color: var(--title); }
dialog .db { padding: 14px 16px; max-height: 70vh; overflow: auto; }
dialog .df { padding: 0 16px 16px; display: flex; gap: 10px; }
dialog .df .btn { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--toast); color: #fff; padding: 12px 18px; border-radius: var(--radius-sm); z-index: 50; font-weight: 600; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { flex: 1; min-height: 48px; border: 0; background: var(--card); color: var(--title); font: inherit; font-weight: 700; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.alerta { border-left: 4px solid var(--bad); }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<dialog id="dlg"></dialog>

<script>
'use strict';
/* =========================================================================
   Ferramentaria — conferência de ferramentas por turno (manutenção de vagões)
   Local primeiro: tudo é salvo no aparelho (localStorage) na hora e, com login,
   sincronizado com a nuvem (Supabase) quando há internet. Ver "Nuvem" abaixo.
   ========================================================================= */

const CHAVE = 'ferramentaria_v1';
const MOTIVOS_DIF = ['Não localizada', 'Em uso no vagão', 'Enviada p/ reparo', 'Quebrada', 'Emprestada a outra equipe', 'Encontrada', 'Erro na contagem anterior'];

/* ---------- Armazenamento ---------- */
const DB = {
  dados: null,
  vazio() {
    return {
      versao: 1,
      dispositivo: uid(),
      // contatos = [{nome, numero}] para alertas
      config: { oficina: '', turnos: ['Turno A', 'Turno B', 'Turno C'], equipe: [], cegas: false, contatos: [], whatsAuto: true },
      itens: [],         // {id, codigo, nome, categoria, local, obs, ativo, criadoEm, atualizadoEm}
      movs: [],          // {id, itemId, qtd (+/-), tipo, motivo, por, em}
      conferencias: [],  // {id, turno, responsavel, iniciadaEm, fechadaEm, linhas[], envios{}}
      tratamentos: [],   // {id: confId + ':' + itemId, confId, itemId, nota, por, em}
      rascunho: null     // conferência em andamento: fica só neste aparelho
    };
  },
  carregar() {
    try { this.dados = JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { this.dados = null; }
    if (!this.dados || !this.dados.versao) this.dados = this.vazio();
    const v = this.vazio();
    this.dados.config = Object.assign(v.config, this.dados.config || {});
    delete this.dados.config.senha;  // PIN das versões 1.1–1.4: substituído pelos níveis de acesso
    for (const k of ['itens', 'movs', 'conferencias', 'tratamentos']) if (!Array.isArray(this.dados[k])) this.dados[k] = [];
    // v1.2 guardava os tratamentos dentro da conferência; agora são registros próprios (sincronizam sem conflito)
    for (const c of this.dados.conferencias) if (c.tratamentos) {
      for (const [itemId, t] of Object.entries(c.tratamentos)) {
        const id = c.id + ':' + itemId;
        if (!this.dados.tratamentos.some((x) => x.id === id)) this.dados.tratamentos.push(Object.assign({ id, confId: c.id, itemId }, t));
      }
      delete c.tratamentos;
    }
  },
  salvar(semEnviar) {
    try { localStorage.setItem(CHAVE, JSON.stringify(this.dados)); }
    catch (e) { alert('Não foi possível salvar no aparelho: ' + e.message); }
    if (!semEnviar) Nuvem.agendar();
  }
};

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
const agora = () => new Date().toISOString();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, el = document) => el.querySelector(s);
function fmt(ts, comAno) {
  if (!ts) return '';
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}${comAno ? '/' + d.getFullYear() : ''} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach((x) => x.remove());  // um aviso por vez
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

/* ---------- Regras de negócio ---------- */
const D = () => DB.dados;
const itensAtivos = () => D().itens.filter((i) => i.ativo !== false)
  .sort((a, b) => (a.local || '').localeCompare(b.local || '', 'pt') || a.nome.localeCompare(b.nome, 'pt'));
const itemPorId = (id) => D().itens.find((i) => i.id === id);
// Nível de acesso: vem do login (tabela perfis na nuvem). Sem nuvem, o aparelho tem acesso total.
const supervisor = () => !Nuvem.ativa() || Nuvem.sessao.papel === 'supervisor';
const SO_SUPERVISOR = new Set(['novo-item', 'editar-item', 'mov', 'importar', 'desativar', 'reativar', 'tratar',
  'salvar-cfg', 'salvar-alertas', 'backup', 'restaurar', 'csv', 'apagar', 'sair']);
const tratamentoDe = (confId, itemId) => D().tratamentos.find((t) => t.id === confId + ':' + itemId);
const ultimaConferencia = () => D().conferencias.reduce((u, c) => (!u || c.fechadaEm > u.fechadaEm ? c : u), null);

// Quantidade esperada agora = contagem da última conferência + movimentações registradas depois dela.
function esperado(itemId) {
  const ult = ultimaConferencia();
  let base = 0, desde = '';
  if (ult) {
    desde = ult.fechadaEm;
    const l = ult.linhas.find((x) => x.itemId === itemId);
    if (l) base = l.contado;
  }
  for (const m of D().movs) if (m.itemId === itemId && m.em > desde) base += m.qtd;
  return base;
}
function movsDesdeUltima(itemId) {
  const ult = ultimaConferencia();
  const desde = ult ? ult.fechadaEm : '';
  return D().movs.filter((m) => m.itemId === itemId && m.em > desde);
}
function divergenciasPendentes() {
  const r = [];
  for (const c of D().conferencias) for (const l of c.linhas) {
    if (l.contado !== l.esperado && !tratamentoDe(c.id, l.itemId)) r.push({ c, l });
  }
  return r.sort((a, b) => (b.c.fechadaEm > a.c.fechadaEm ? 1 : -1));
}
function difTexto(d) { return d > 0 ? `sobra +${d}` : `falta ${-d}`; }
function sugerirTurno() {
  const h = new Date().getHours();
  const t = D().config.turnos;
  if (t.length === 3) return h >= 6 && h < 14 ? t[0] : h >= 14 && h < 22 ? t[1] : t[2];
  return t[0] || '';
}

/* ---------- Navegação (hash, para o botão Voltar do Android funcionar) ---------- */
const ICONES = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  conferir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v3h6V3"/><path d="M9 13l2 2 4-4"/></svg>',
  ferramentas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  historico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  ajustes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>'
};
const ABAS = [['inicio', 'Início'], ['conferir', 'Conferir'], ['ferramentas', 'Ferramentas'], ['historico', 'Histórico'], ['ajustes', 'Ajustes']];

function ir(h) { location.hash = h; }
function rota() {
  const [nome, arg] = (location.hash.slice(1) || 'inicio').split('/');
  return { nome, arg: arg ? decodeURIComponent(arg) : '' };
}
function topo(titulo, voltar) {
  const of = D().config.oficina;
  $('#top').innerHTML = `${voltar ? '<button data-a="voltar" aria-label="Voltar">‹</button>' : ''}
    <h1>${esc(titulo)}${of ? `<span class="sub">${esc(of)}</span>` : ''}</h1>
    ${Nuvem.ativa() ? '<button class="sinc" id="sincSt" data-a="sinc-info" aria-label="Situação da nuvem"></button>' : ''}`;
  Nuvem.mostrar();
}
function render() {
  if (Nuvem.precisaLogin()) return telaLogin();
  const r = rota();
  const aba = { conf: 'historico', item: 'ferramentas', resultado: 'conferir' }[r.nome] || r.nome;
  $('#tabs').innerHTML = ABAS.map(([k, n]) => `<a href="#${k}" class="${k === aba ? 'on' : ''}">${ICONES[k]}${k === 'ajustes' && !supervisor() ? 'Conta' : n}</a>`).join('');
  const v = VIEWS[r.nome] || VIEWS.inicio;
  v(r.arg);
  window.scrollTo(0, 0);
}

/* ---------- Telas ---------- */
const VIEWS = {};

VIEWS.inicio = () => {
  topo('Ferramentaria');
  const ult = ultimaConferencia();
  const itens = itensAtivos();
  const total = itens.reduce((s, i) => s + esperado(i.id), 0);
  const pend = divergenciasPendentes();
  const rasc = D().rascunho;
  let status;
  if (!ult) status = `<div class="status neutral"><div class="big">Nenhuma conferência ainda</div><div class="muted">${itens.length ? 'Faça a primeira conferência para registrar as quantidades de partida.' : 'Comece cadastrando as ferramentas da equipe.'}</div></div>`;
  else {
    const nd = ult.linhas.filter((l) => l.contado !== l.esperado).length;
    status = `<div class="status ${nd ? 'bad' : 'ok'}"><div class="big">${nd ? `⚠ ${nd} divergência${nd > 1 ? 's' : ''}` : '✓ Tudo confere'}</div>
      <div>Última conferência: <b>${esc(ult.turno)}</b> · ${fmt(ult.fechadaEm)} · ${esc(ult.responsavel)}</div></div>`;
  }
  $('#app').innerHTML = `
    ${status}
    <div class="kpis">
      <div class="kpi"><b>${itens.length}</b><span>itens cadastrados</span></div>
      <div class="kpi"><b>${total}</b><span>unidades esperadas</span></div>
      <div class="kpi"><b style="color:${pend.length ? 'var(--bad)' : 'inherit'}">${pend.length}</b><span>alertas pendentes</span></div>
    </div>
    ${itens.length ? `<button class="btn big primary" data-a="ir" data-h="conferir">${rasc ? 'Continuar conferência em andamento' : 'Iniciar conferência de turno'}</button>`
      : supervisor() ? `<button class="btn big primary" data-a="novo-item">Cadastrar primeira ferramenta</button>` : '<div class="card muted">Nenhuma ferramenta cadastrada. O cadastro é feito pelo supervisor.</div>'}
    ${pend.length ? `<div class="group-h">Alertas pendentes</div><div class="list">${pend.map(({ c, l }) => `
      <div class="li alerta"><div class="grow"><div class="t">${esc(l.nome)} <span class="tag bad">${difTexto(l.contado - l.esperado)}</span></div>
      <div class="s">${esc(c.turno)} · ${fmt(c.fechadaEm)} · ${esc(c.responsavel)}${l.justificativa ? ' · “' + esc(l.justificativa) + '”' : ''}</div></div>
      ${supervisor() ? `<button class="btn" data-a="tratar" data-c="${c.id}" data-i="${l.itemId}">Tratar</button>` : ''}</div>`).join('')}</div>` : ''}
  `;
};

/* --- Conferência --- */
VIEWS.conferir = () => {
  const rasc = D().rascunho;
  topo('Conferência de turno');
  const itens = itensAtivos();
  if (!itens.length) { $('#app').innerHTML = `<div class="empty">Nenhuma ferramenta cadastrada.<br><br><button class="btn primary" data-a="ir" data-h="ferramentas">Ir para Ferramentas</button></div>`; return; }
  if (!rasc) return telaInicioConferencia();
  telaContagem();
};

function telaInicioConferencia() {
  const cfg = D().config;
  const ult = ultimaConferencia();
  $('#app').innerHTML = `
    <div class="card stack">
      <div><label class="f">Turno</label><div class="chips" id="cTurno">${cfg.turnos.map((t) => `<button data-v="${esc(t)}" class="${t === sugerirTurno() ? 'on' : ''}">${esc(t)}</button>`).join('')}</div></div>
      <div><label class="f" for="cResp">Responsável pela conferência</label>
        ${cfg.equipe.length ? `<select id="cResp"><option value="">Selecione…</option>${cfg.equipe.map((p) => `<option>${esc(p)}</option>`).join('')}</select>`
          : `<input id="cResp" placeholder="Nome de quem está conferindo" autocomplete="name">`}
      </div>
      <div class="muted small">${ult ? `Comparando com: <b>${esc(ult.turno)}</b> de ${fmt(ult.fechadaEm)} (${esc(ult.responsavel)})` : 'Primeira conferência: a contagem será comparada com as quantidades cadastradas.'}</div>
      <button class="btn big primary" data-a="iniciar-conf">Começar contagem</button>
    </div>`;
  $('#cTurno').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    [...$('#cTurno').children].forEach((x) => x.classList.toggle('on', x === b));
  });
}

let filtroConf = '';
function telaContagem() {
  const r = D().rascunho;
  const cegas = D().config.cegas;
  const itens = itensAtivos();
  const q = filtroConf.trim().toLowerCase();
  const vis = itens.filter((i) => !q || (i.nome + ' ' + (i.codigo || '') + ' ' + (i.local || '')).toLowerCase().includes(q));
  const contados = itens.filter((i) => r.contagens[i.id] != null).length;
  const grupos = {};
  for (const i of vis) (grupos[i.local || 'Sem local'] ||= []).push(i);
  $('#app').innerHTML = `
    <div class="card">
      <div class="row"><div class="grow"><b>${esc(r.turno)}</b> · ${esc(r.responsavel)}<div class="small muted">Iniciada ${fmt(r.iniciadaEm)}${cegas ? ' · contagem às cegas' : ''}</div></div>
      <button class="btn danger" data-a="cancelar-conf">Descartar</button></div>
      <div class="progress"><i style="width:${(contados / itens.length) * 100}%"></i></div>
      <div class="small muted">${contados} de ${itens.length} itens conferidos</div>
    </div>
    <input id="fConf" type="search" placeholder="Buscar ferramenta, código ou local" value="${esc(filtroConf)}" style="margin-bottom:6px">
    ${Object.entries(grupos).map(([g, lst]) => `<div class="group-h">${esc(g)}</div><div class="list">${lst.map((i) => linhaContagem(i, r, cegas)).join('')}</div>`).join('') || '<div class="empty">Nada encontrado.</div>'}
    <div class="sticky-foot"><button class="btn big primary" data-a="fechar-conf">Encerrar conferência</button></div>`;
  const f = $('#fConf');
  f.addEventListener('input', () => { filtroConf = f.value; const pos = f.selectionStart; telaContagem(); const n = $('#fConf'); n.focus(); n.setSelectionRange(pos, pos); });
}
function linhaContagem(i, r, cegas) {
  const esp = esperado(i.id);
  const c = r.contagens[i.id];
  const temC = c != null;
  const dif = temC ? c - esp : 0;
  const mv = movsDesdeUltima(i.id);
  const mvTxt = mv.length && !cegas ? `<div class="s">Movimentações desde o último turno: ${mv.map((m) => (m.qtd > 0 ? '+' : '') + m.qtd).join(', ')}</div>` : '';
  let tag = '<span class="tag">a conferir</span>';
  if (temC) tag = cegas ? '<span class="tag">contado</span>' : dif === 0 ? '<span class="tag ok">confere</span>' : `<span class="tag bad">${difTexto(dif)}</span>`;
  return `<div class="cnt ${temC && dif && !cegas ? 'dif' : ''}" data-item="${i.id}">
    <div class="top"><div class="grow"><div class="t" style="font-weight:600">${esc(i.nome)}</div>
      <div class="s small muted">${i.codigo ? esc(i.codigo) + ' · ' : ''}${cegas ? 'contagem às cegas' : `turno anterior: <b>${esp}</b>`}</div>${mvTxt}</div>${tag}</div>
    <div class="ctl">
      <button data-a="menos" aria-label="Diminuir">−</button>
      <input type="number" inputmode="numeric" min="0" value="${temC ? c : ''}" placeholder="—" data-a="qtd" aria-label="Quantidade contada">
      <button data-a="mais" aria-label="Aumentar">+</button>
      ${cegas ? '' : `<button class="same" data-a="igual">= ${esp}</button>`}
    </div></div>`;
}
function setContagem(itemId, valor) {
  const r = D().rascunho;
  if (valor === '' || valor == null || isNaN(valor)) delete r.contagens[itemId];
  else r.contagens[itemId] = Math.max(0, Math.floor(Number(valor)));
  DB.salvar();
  // Atualiza só a linha e o progresso, sem perder a rolagem.
  const el = document.querySelector(`.cnt[data-item="${CSS.escape(itemId)}"]`);
  // (trocar o input focado dispara blur/change de novo; a trava evita a troca dupla)
  if (el && !setContagem.trava) {
    setContagem.trava = true;
    const n = document.createElement('div'); n.innerHTML = linhaContagem(itemPorId(itemId), r, D().config.cegas);
    try { el.replaceWith(n.firstElementChild); } finally { setContagem.trava = false; }
  }
  const itens = itensAtivos();
  const contados = itens.filter((i) => r.contagens[i.id] != null).length;
  $('.progress i').style.width = (contados / itens.length) * 100 + '%';
  $('.progress + .small').textContent = `${contados} de ${itens.length} itens conferidos`;
}

function fecharConferencia() {
  const r = D().rascunho;
  const itens = itensAtivos();
  const falt = itens.filter((i) => r.contagens[i.id] == null);
  if (falt.length) {
    vibrar(200);
    return modal({ titulo: 'Contagem incompleta', corpo: `<p>Ainda faltam <b>${falt.length}</b> ite${falt.length > 1 ? 'ns' : 'm'} para conferir:</p><div class="small">${falt.slice(0, 12).map((i) => '• ' + esc(i.nome)).join('<br>')}${falt.length > 12 ? '<br>…' : ''}</div>`, ok: 'Voltar à contagem', cancelar: null });
  }
  const linhas = itens.map((i) => ({ itemId: i.id, codigo: i.codigo || '', nome: i.nome, local: i.local || '', esperado: esperado(i.id), contado: r.contagens[i.id], justificativa: '' }));
  const difs = linhas.filter((l) => l.contado !== l.esperado);
  if (!difs.length) return confirmarFechamento(linhas);
  vibrar([200, 100, 200]);
  modal({
    titulo: `⚠ ${difs.length} divergência${difs.length > 1 ? 's' : ''} com o turno anterior`,
    corpo: `<p class="small muted">Informe o motivo de cada diferença. O alerta fica registrado e pendente até ser tratado.</p>` +
      difs.map((l, k) => `<div class="card" style="margin:0 0 10px;border-color:var(--bad)">
        <div class="row"><b class="grow">${esc(l.nome)}</b><span class="tag bad">${difTexto(l.contado - l.esperado)}</span></div>
        <div class="small muted">Anterior ${l.esperado} → contado ${l.contado}</div>
        <div class="chips" data-k="${k}">${MOTIVOS_DIF.map((m) => `<button type="button" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>
        <input data-just="${k}" placeholder="Motivo / observação (obrigatório)"></div>`).join(''),
    ok: 'Registrar com divergência', cancelar: 'Recontar',
    aoAbrir(dlg) {
      dlg.addEventListener('click', (e) => {
        const b = e.target.closest('.chips button'); if (!b) return;
        const k = b.parentElement.dataset.k;
        dlg.querySelector(`[data-just="${k}"]`).value = b.dataset.v;
        [...b.parentElement.children].forEach((x) => x.classList.toggle('on', x === b));
      });
    },
    validar(dlg) {
      let ok = true;
      difs.forEach((l, k) => { const inp = dlg.querySelector(`[data-just="${k}"]`); l.justificativa = inp.value.trim(); if (!l.justificativa) { ok = false; inp.style.outline = '2px solid var(--bad)'; } });
      if (!ok) toast('Preencha o motivo de todas as divergências');
      return ok;
    },
    aoConfirmar() { confirmarFechamento(linhas, false); }
  });
}
function confirmarFechamento(linhas) {
  const r = D().rascunho;
  const c = { id: uid(), turno: r.turno, responsavel: r.responsavel, iniciadaEm: r.iniciadaEm, fechadaEm: agora(), linhas, dispositivo: D().dispositivo };
  D().conferencias.push(c);
  D().rascunho = null;
  filtroConf = '';
  DB.salvar();
  ir('resultado/' + c.id);
  // Com divergência: já abre o WhatsApp no primeiro contato (ainda dentro do toque, senão o Android bloqueia)
  const cts = D().config.contatos;
  if (D().config.whatsAuto && cts.length && linhas.some((l) => l.contado !== l.esperado)) abrirWhats(c, cts[0]);
}

VIEWS.resultado = (id) => {
  const c = D().conferencias.find((x) => x.id === id);
  if (!c) return ir('inicio');
  topo('Conferência registrada');
  const difs = c.linhas.filter((l) => l.contado !== l.esperado);
  $('#app').innerHTML = `
    <div class="status ${difs.length ? 'bad' : 'ok'}"><div class="big">${difs.length ? `⚠ ${difs.length} divergência${difs.length > 1 ? 's' : ''}` : '✓ Tudo confere com o turno anterior'}</div>
      <div>${esc(c.turno)} · ${fmt(c.fechadaEm)} · ${esc(c.responsavel)}</div></div>
    ${difs.length ? `<div class="list">${difs.map((l) => `<div class="li"><div class="grow"><div class="t">${esc(l.nome)}</div><div class="s">${l.esperado} → ${l.contado} · ${esc(l.justificativa)}</div></div><span class="tag bad">${difTexto(l.contado - l.esperado)}</span></div>`).join('')}</div>` : ''}
    ${difs.length ? blocoEnvios(c) : ''}
    <div class="stack">
      <button class="btn big ${difs.length && D().config.contatos.length ? '' : 'primary'}" data-a="compartilhar" data-c="${c.id}">Enviar relatório (WhatsApp, e-mail…)</button>
      <button class="btn full" data-a="ir" data-h="conf/${c.id}">Ver conferência completa</button>
      <button class="btn full" data-a="ir" data-h="inicio">Voltar ao início</button>
    </div>`;
  if (difs.length) vibrar([300, 120, 300]);
};

function textoRelatorio(c) {
  const difs = c.linhas.filter((l) => l.contado !== l.esperado);
  const of = D().config.oficina;
  let t = `*Conferência de ferramentas${of ? ' – ' + of : ''}*\n${c.turno} · ${fmt(c.fechadaEm, true)}\nResponsável: ${c.responsavel}\nItens conferidos: ${c.linhas.length} · Unidades: ${c.linhas.reduce((s, l) => s + l.contado, 0)}\n\n`;
  if (!difs.length) t += '✅ Tudo confere com o turno anterior.';
  else {
    t += `⚠️ *${difs.length} divergência(s):*\n`;
    for (const l of difs) t += `• ${l.nome}${l.codigo ? ' (' + l.codigo + ')' : ''}: anterior ${l.esperado}, contado ${l.contado} (${difTexto(l.contado - l.esperado)}) – ${l.justificativa}\n`;
  }
  return t;
}
/* --- Alerta por WhatsApp em 1 toque ---
   Abre a conversa do contato com a mensagem pronta; a pessoa só toca em Enviar.
   (Envio sem toque exige a API oficial do WhatsApp e um servidor: etapa da nuvem.) */
function numeroWa(txt) {
  let n = String(txt || '').replace(/\D/g, '').replace(/^0+/, '');
  if (n.length === 10 || n.length === 11) n = '55' + n;  // DDD + número, sem código do país
  return n.length >= 12 && n.length <= 13 ? n : '';
}
function abrirWhats(c, ct) {
  const url = `https://wa.me/${ct.numero}?text=${encodeURIComponent(textoRelatorio(c))}`;
  c.envios = c.envios || {};
  c.envios[ct.numero] = agora();
  DB.salvar();
  if (!window.open(url, '_blank')) location.href = url;
  setTimeout(() => { if (rota().nome === 'resultado' || rota().nome === 'conf') render(); }, 300);
}
function blocoEnvios(c) {
  const cts = D().config.contatos;
  if (!cts.length) return `<div class="card small muted">Dica: cadastre em <b>Ajustes → Alertas por WhatsApp</b> quem deve ser avisado; o app abre a conversa pronta ao fechar com divergência.</div>`;
  const env = c.envios || {};
  const prox = cts.find((ct) => !env[ct.numero]);
  return `<div class="group-h">Avisar pelo WhatsApp</div><div class="list">${cts.map((ct) => `
    <div class="li"><div class="grow"><div class="t">${esc(ct.nome)}</div><div class="s">${env[ct.numero] ? '✓ aberto no WhatsApp ' + fmt(env[ct.numero]) : '+' + esc(ct.numero)}</div></div>
    <button class="btn ${ct === prox ? 'primary' : ''}" data-a="whats" data-c="${c.id}" data-n="${esc(ct.numero)}">${env[ct.numero] ? 'Reenviar' : 'Enviar'}</button></div>`).join('')}</div>`;
}

async function compartilhar(c) {
  const texto = textoRelatorio(c);
  if (navigator.share) { try { await navigator.share({ title: 'Conferência de ferramentas', text: texto }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  location.href = 'https://wa.me/?text=' + encodeURIComponent(texto);
}

    ${todos.length ? `<input id="fIt" type="search" placeholder="Buscar" value="${esc(filtroItens)}">` : ''}

    <div class="group-h">Movimentações</div>

function formMov(i) {
  const cfg = D().config;
  let tipo = 'Baixa';
  modal({
    titulo: 'Entrada / Baixa — ' + i.nome,
    corpo: `<div class="stack">
      <div class="seg" id="mTipo"><button data-v="Entrada">Entrada (+)</button><button data-v="Baixa" class="on">Baixa (−)</button></div>
      <div><label class="f">Quantidade</label><input id="mQtd" type="number" inputmode="numeric" min="1" value="1"></div>
      <div><label class="f">Motivo *</label><input id="mMot" list="dlMot" placeholder="Ex.: compra, quebra, enviada p/ reparo"><datalist id="dlMot">${['Compra', 'Retorno de reparo', 'Transferência recebida', 'Quebra', 'Perda', 'Enviada p/ reparo', 'Transferência para outra equipe', 'Descarte'].map((m) => `<option value="${m}">`).join('')}</datalist></div>
      <div><label class="f">Registrado por</label>${cfg.equipe.length ? `<select id="mPor"><option value=""></option>${cfg.equipe.map((p) => `<option>${esc(p)}</option>`).join('')}</select>` : '<input id="mPor">'}</div>
      <p class="small muted">Atual esperado: <b>${esperado(i.id)}</b>. A próxima conferência já vai considerar esta movimentação.</p></div>`,
    ok: 'Registrar',
    aoAbrir(dlg) { dlg.querySelector('#mTipo').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; tipo = b.dataset.v; [...b.parentElement.children].forEach((x) => x.classList.toggle('on', x === b)); }); },
    validar(dlg) {
      const q = Math.floor(Number(dlg.querySelector('#mQtd').value));

/* ---------- Nuvem (Supabase) ----------
   Local primeiro: o app grava no aparelho e envia quando há internet.
   - Envio: cada registro tem uma "impressão digital"; manda só o que mudou desde o último envio.
   - Recebimento: busca o que mudou na nuvem desde a última busca (hora do servidor, com 2 min de folga).
   - Conflito (mesmo registro alterado em 2 aparelhos antes de sincronizar): vale o último envio.
   Só leitura/gravação com login; as regras de acesso estão em supabase/*.sql. */
const SUPA_URL = 'https://blizyewnlcyaxizwlzdk.supabase.co';
const SUPA_KEY = 'sb_publishable_F82gpF8qtfC-cezTvYzEwQ_n0ZGAR4A';  // chave pública (segura com as regras de acesso)
const COLECOES = ['config', 'itens', 'movs', 'conferencias', 'tratamentos'];

// JSON com chaves em ordem fixa: o banco reordena as chaves e a impressão digital precisa bater.
function estavel(v) {
  if (Array.isArray(v)) return '[' + v.map(estavel).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + estavel(v[k])).join(',') + '}';
  return v === undefined ? 'null' : JSON.stringify(v);
}
function digital(obj) {
  const t = estavel(obj);
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
  return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36) + t.length.toString(36);
}

const Nuvem = {
  sessao: null, sinc: null, rodando: false, deNovo: false, timer: null, estado: 'ok', erro: '',
  carregar() {
    try { this.sessao = JSON.parse(localStorage.getItem('ferramentaria_sessao')); } catch (e) { this.sessao = null; }
    try { this.sinc = JSON.parse(localStorage.getItem('ferramentaria_sinc')); } catch (e) { this.sinc = null; }
    if (!this.sinc) this.sinc = { cursor: {}, enviado: {}, ultima: null };
    for (const c of COLECOES) this.sinc.enviado[c] = this.sinc.enviado[c] || {};
  },
  guardar() {
    try {
      localStorage.setItem('ferramentaria_sessao', JSON.stringify(this.sessao));
      localStorage.setItem('ferramentaria_sinc', JSON.stringify(this.sinc));
    } catch (e) {}
  },
  ativa() { return !!this.sessao; },
  precisaLogin() {
    let local = false;
    try { local = localStorage.getItem('ferramentaria_modo') === 'local'; } catch (e) {}
    return this.sessao ? !!this.sessao.expirada : !local;
  },
  sair() {
    this.sessao = null; this.sinc = { cursor: {}, enviado: {}, ultima: null };
    for (const c of COLECOES) this.sinc.enviado[c] = {};
    this.guardar();
  },

  /* -- login -- */
  async auth(corpo, tipo) {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=${tipo}`, { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(d.error_description || d.msg || d.message || 'Falha no login'); e.status = r.status; e.codigo = d.error_code || d.error; throw e; }
    this.sessao = { token: d.access_token, refresh: d.refresh_token, expira: Date.now() + d.expires_in * 1000, email: (d.user && d.user.email) || (this.sessao && this.sessao.email) };
    this.guardar();
  },
  async token() {
    if (Date.now() > this.sessao.expira - 60000) {
      try { await this.auth({ refresh_token: this.sessao.refresh }, 'refresh_token'); }
      catch (e) { if (e.status === 400 || e.status === 401 || e.status === 403) { this.sessao.expirada = true; this.guardar(); } throw e; }
    }
    return this.sessao.token;
  },
  async api(caminho, opt = {}) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${caminho}`, Object.assign({}, opt, {
      headers: Object.assign({ apikey: SUPA_KEY, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'application/json' }, opt.headers || {})
    }));
    if (!r.ok) { const e = new Error(`${r.status} ${(await r.text()).slice(0, 200)}`); e.status = r.status; throw e; }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },

  /* -- nível de acesso do login (técnico se não houver linha em perfis) -- */
  async carregarPapel() {
    let papel = 'tecnico';
    try { const r = await this.api('perfis?select=papel'); if (r && r[0] && r[0].papel) papel = r[0].papel; }
    catch (e) { if (e instanceof TypeError || (this.sessao && this.sessao.expirada)) throw e; }  // sem rede: mantém o que já sabia
    const mudou = this.sessao.papel !== papel;
    this.sessao.papel = papel; this.guardar();
    return mudou;
  },
  // Técnico só envia conferências; o resto é do supervisor (a nuvem também recusa).
  podeEnviar(col) { return col === 'conferencias' || this.sessao.papel === 'supervisor'; },

  /* -- registros locais por coleção -- */
  registros(col) { return col === 'config' ? [['config', D().config]] : D()[col].map((x) => [x.id, x]); },
  obter(col, id) { return col === 'config' ? D().config : D()[col].find((x) => x.id === id); },
  aplicar(col, id, dados) {
    if (col === 'config') { DB.dados.config = Object.assign(DB.vazio().config, dados); return; }
    const atual = D()[col].find((x) => x.id === id);
    if (atual) { for (const k of Object.keys(atual)) delete atual[k]; Object.assign(atual, dados); }  // mantém a mesma referência
    else D()[col].push(dados);
  },
  contarPendentes() {
    if (!this.ativa()) return 0;
    let n = 0;
    for (const col of COLECOES) { if (!this.podeEnviar(col)) continue; const env = this.sinc.enviado[col]; for (const [id, obj] of this.registros(col)) if (env[id] !== digital(obj)) n++; }
    return n;
  },
  receber(col, linha, primeira) {
    const env = this.sinc.enviado[col];
    const dRemoto = digital(linha.dados);
    const local = this.obter(col, linha.id);
    if (local) {
      const dLocal = digital(local);
      if (dLocal === dRemoto) { env[linha.id] = dRemoto; return false; }
      // Alterado aqui e ainda não enviado: o envio vai atualizar a nuvem.
      // Exceção: na 1ª sincronização os ajustes da nuvem prevalecem sobre os padrões de um aparelho novo.
      // (Coleções que este nível não pode enviar: vale sempre a nuvem.)
      if (env[linha.id] !== dLocal && !(col === 'config' && primeira) && this.podeEnviar(col)) return false;
    }
    this.aplicar(col, linha.id, linha.dados);
    env[linha.id] = dRemoto;
    return true;
  },

  /* -- sincronização -- */
  agendar(ms = 1500) {
    if (!this.ativa()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.sincronizar(), ms);
  },
  async sincronizar() {
    if (!this.ativa() || this.sessao.expirada) return;
    if (this.rodando) { this.deNovo = true; return; }
    if (!navigator.onLine) { this.estado = 'offline'; this.mostrar(); return; }
    this.rodando = true; this.estado = 'enviando'; this.mostrar();
    let chegou = false;
    try {
      if (await this.carregarPapel()) chegou = true;  // nível mudou: redesenha a tela
      // 1) Recebe o que mudou na nuvem
      for (const col of COLECOES) {
        const primeira = this.sinc.cursor[col] == null;  // nunca buscou esta coleção neste aparelho
        const cursor = this.sinc.cursor[col] || 0;
        const desde = new Date(Math.max(0, cursor - 120000)).toISOString();
        let maior = cursor;
        for (let offset = 0; ; offset += 1000) {
          const linhas = await this.api(`${col}?select=id,dados,sinc_em&sinc_em=gte.${encodeURIComponent(desde)}&order=sinc_em.asc,id.asc&limit=1000&offset=${offset}`);
          for (const l of linhas) { if (this.receber(col, l, primeira)) chegou = true; maior = Math.max(maior, Date.parse(l.sinc_em)); }
          if (linhas.length < 1000) break;
        }
        this.sinc.cursor[col] = maior;
      }
      if (chegou) DB.salvar(true);
      // 2) Envia o que mudou aqui
      for (const col of COLECOES) {
        if (!this.podeEnviar(col)) continue;
        const env = this.sinc.enviado[col];
        const lote = [];
        for (const [id, obj] of this.registros(col)) { const d = digital(obj); if (env[id] !== d) lote.push({ id, d, corpo: JSON.stringify({ id, dados: obj, dispositivo: D().dispositivo }) }); }
        for (let i = 0; i < lote.length; i += 200) {
          const parte = lote.slice(i, i + 200);
          await this.api(`${col}?on_conflict=id`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: '[' + parte.map((x) => x.corpo).join(',') + ']' });
          for (const x of parte) env[x.id] = x.d;
        }
      }
      this.sinc.ultima = agora();
      this.estado = 'ok'; this.erro = '';
    } catch (e) {
      this.estado = !navigator.onLine || e instanceof TypeError ? 'offline' : 'erro';
      this.erro = e.message;
      if (this.sessao && this.sessao.expirada) { this.guardar(); this.rodando = false; render(); return; }
    }
    this.guardar();
    this.rodando = false;
    this.mostrar();
    // Mostra o que chegou de outros aparelhos, sem atrapalhar quem está digitando ou contando
    const ae = document.activeElement;
    if (chegou && !$('#dlg').open && !(rota().nome === 'conferir' && D().rascunho) && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) render();
    if (this.deNovo) { this.deNovo = false; this.agendar(300); }
  },
  textoEstado() {
    const n = this.contarPendentes();
    const ult = this.sinc.ultima ? 'Última sincronização: ' + fmt(this.sinc.ultima) : 'Ainda não sincronizado';
    if (this.estado === 'offline') return `Sem internet. ${n} alteração(ões) serão enviadas quando o sinal voltar.`;
    if (this.estado === 'erro') return `Erro ao sincronizar (${this.erro.slice(0, 80)}). ${n} pendente(s).`;
    if (this.estado === 'enviando') return 'Sincronizando…';
    return `${ult}.${n ? ` ${n} pendente(s).` : ' Tudo salvo na nuvem.'}`;
  },
  mostrar() {
    const el = document.getElementById('sincSt');
    if (!el) return;
    const n = this.estado === 'enviando' ? 0 : this.contarPendentes();
    el.className = 'sinc ' + this.estado;
    el.textContent = this.estado === 'enviando' ? '☁ ↻' : this.estado === 'offline' ? `☁ sem sinal${n ? ' · ' + n : ''}` : this.estado === 'erro' ? '☁ ⚠' : n ? `☁ ${n}` : '☁ ✓';
  }
};

function telaLogin() {
  const exp = Nuvem.sessao && Nuvem.sessao.expirada;
  $('#top').innerHTML = '<h1>Ferramentaria</h1>';
  $('#tabs').innerHTML = '';
  $('#app').innerHTML = `
    <div class="card stack" style="margin-top:16px">
      <div style="font-size:20px;font-weight:800">${exp ? 'Entre de novo' : 'Entrar na conta da equipe'}</div>
      <p class="small muted" style="margin:0">${exp ? 'A sessão expirou. Os dados deste aparelho estão guardados e serão enviados ao entrar.' : 'Com login, os dados ficam salvos na nuvem e todos os aparelhos da equipe veem o mesmo controle. O app continua funcionando sem internet.'}</p>
      <div><label class="f" for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" inputmode="email" value="${esc(Nuvem.sessao ? Nuvem.sessao.email : '')}"></div>
      <div><label class="f" for="lgSenha">Senha</label><input id="lgSenha" type="password" autocomplete="current-password"></div>
      <button class="btn big primary" data-a="entrar">Entrar</button>
      ${exp ? '' : '<button class="btn full" data-a="modo-local">Usar sem nuvem (só neste aparelho)</button>'}
    </div>`;
  $('#lgSenha').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
}
async function entrar() {
  const email = $('#lgEmail').value.trim(), senha = $('#lgSenha').value;
  if (!email || !senha) return toast('Informe e-mail e senha');
  if (!navigator.onLine) return toast('É preciso internet para entrar');
  const b = $('[data-a=entrar]'); b.disabled = true; b.textContent = 'Entrando…';
  try {
    const antes = Nuvem.sessao && Nuvem.sessao.email;
    if (antes && antes.toLowerCase() !== email.toLowerCase()) { b.disabled = false; b.textContent = 'Entrar'; return toast('Use a mesma conta (' + antes + ') ou saia dela em Ajustes'); }
    await Nuvem.auth({ email, password: senha }, 'password');
    try { localStorage.removeItem('ferramentaria_modo'); } catch (e) {}
    ir('inicio'); render();
    toast('Conectado. Sincronizando…');
    await Nuvem.sincronizar();
    toast(Nuvem.estado === 'ok' ? 'Dados sincronizados com a nuvem' : Nuvem.textoEstado());
    render();
  } catch (e) {
    b.disabled = false; b.textContent = 'Entrar';
    toast(e.status === 400 ? 'E-mail ou senha incorretos' : e instanceof TypeError ? 'Sem conexão com a nuvem' : 'Erro: ' + e.message);
  }
}

// Troca o login no mesmo aparelho (ex.: técnico → supervisor). Os dados da equipe são os mesmos
// para todos os logins, então nada é apagado: só muda o nível de acesso.
function trocarLogin() {
  if (!navigator.onLine) return toast('É preciso internet para trocar de login');
  modal({
    titulo: 'Trocar de login',
    corpo: `<div class="stack">
      <p class="small muted" style="margin:0">Agora: <b>${esc(Nuvem.sessao.email)}</b> (${supervisor() ? 'Supervisor' : 'Técnico'}). Os dados do aparelho continuam; muda só o que este login pode fazer.</p>
      <div><label class="f" for="tlEmail">E-mail</label><input id="tlEmail" type="email" inputmode="email" autocomplete="username"></div>
      <div><label class="f" for="tlSenha">Senha</label><input id="tlSenha" type="password" autocomplete="current-password"></div></div>`,
    ok: 'Entrar',
    validar(dlg) {
      if (!dlg.querySelector('#tlEmail').value.trim() || !dlg.querySelector('#tlSenha').value) { toast('Informe e-mail e senha'); return false; }
      return true;
    },
    async aoConfirmar(dlg) {
      const email = dlg.querySelector('#tlEmail').value.trim(), senha = dlg.querySelector('#tlSenha').value;
      toast('Entrando…');
      await Nuvem.sincronizar();  // envia o que o login atual alterou antes de trocar
      const anterior = Nuvem.sessao;
      try { await Nuvem.auth({ email, password: senha }, 'password'); }
      catch (e) { Nuvem.sessao = anterior; Nuvem.guardar(); return toast(e.status === 400 ? 'E-mail ou senha incorretos' : 'Não foi possível entrar: ' + e.message); }
      await Nuvem.sincronizar();  // carrega o nível do novo login
      toast(`Conectado como ${Nuvem.sessao.email} (${supervisor() ? 'Supervisor' : 'Técnico'})`);
      render();
    }
  });
  setTimeout(() => { const i = $('#tlEmail'); if (i) i.focus(); }, 50);
}

/* ---------- Modal genérico ---------- */
function modal({ titulo, corpo, ok = 'OK', cancelar = 'Cancelar', perigo, validar, aoConfirmar, aoAbrir }) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dh">${esc(titulo)}</div><div class="db">${corpo}</div>
    <div class="df">${cancelar ? `<button class="btn" data-m="x">${esc(cancelar)}</button>` : ''}<button class="btn ${perigo ? 'danger' : 'primary'}" data-m="ok">${esc(ok)}</button></div>`;
  dlg.onclick = (e) => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    if (b.dataset.m === 'x') return dlg.close();
    if (validar && !validar(dlg)) return;
    dlg.close();
    aoConfirmar && aoConfirmar(dlg);
  };
  aoAbrir && aoAbrir(dlg);
  dlg.showModal();
}

/* ---------- Ações ---------- */
const ACOES = {
  voltar: () => history.length > 1 ? history.back() : ir('inicio'),
  ir: (el) => ir(el.dataset.h),
  'novo-item': () => formItem(null),
  'editar-item': (el) => formItem(itemPorId(el.dataset.i)),
  mov: (el) => formMov(itemPorId(el.dataset.i)),
  importar: formImportar,
  desativar: (el) => {
    const i = itemPorId(el.dataset.i);
    modal({ titulo: 'Desativar ferramenta?', corpo: `<p><b>${esc(i.nome)}</b> sai das próximas conferências. As ${esperado(i.id)} unidade(s) esperadas recebem baixa automática. O histórico é mantido.</p>`, ok: 'Desativar', perigo: true,
      aoConfirmar() { const q = esperado(i.id); if (q) D().movs.push({ id: uid(), itemId: i.id, qtd: -q, tipo: 'Baixa', motivo: 'Ferramenta desativada', por: '', em: agora() }); i.ativo = false; i.atualizadoEm = agora(); DB.salvar(); render(); } });
  },
  reativar: (el) => { const i = itemPorId(el.dataset.i); i.ativo = true; i.atualizadoEm = agora(); DB.salvar(); toast('Reativada. Registre uma entrada com a quantidade.'); render(); },
  'iniciar-conf': () => {
    const on = $('#cTurno .on');
    const resp = $('#cResp').value.trim();
    if (!on) return toast('Escolha o turno');
    if (!resp) return toast('Informe o responsável');
    D().rascunho = { id: uid(), turno: on.dataset.v, responsavel: resp, iniciadaEm: agora(), contagens: {} };
    DB.salvar(); render();
  },
  'cancelar-conf': () => modal({ titulo: 'Descartar conferência?', corpo: '<p>As contagens feitas até agora serão perdidas.</p>', ok: 'Descartar', perigo: true, aoConfirmar() { D().rascunho = null; filtroConf = ''; DB.salvar(); render(); } }),
  'fechar-conf': fecharConferencia,
  menos: (el) => { const id = el.closest('.cnt').dataset.item; const c = D().rascunho.contagens[id]; setContagem(id, c == null ? 0 : Math.max(0, c - 1)); },
  mais: (el) => { const id = el.closest('.cnt').dataset.item; const c = D().rascunho.contagens[id]; setContagem(id, c == null ? 1 : c + 1); },
  igual: (el) => { const id = el.closest('.cnt').dataset.item; setContagem(id, esperado(id)); },
  compartilhar: (el) => compartilhar(D().conferencias.find((c) => c.id === el.dataset.c)),
  tratar: (el) => formTratar(D().conferencias.find((c) => c.id === el.dataset.c), el.dataset.i),
  whats: (el) => {
    const c = D().conferencias.find((x) => x.id === el.dataset.c);
    const ct = D().config.contatos.find((x) => x.numero === el.dataset.n);
    if (c && ct) abrirWhats(c, ct);
  },
  'salvar-alertas': () => {
    const cts = [], ruins = [];
    for (const linha of $('#cfCts').value.split('\n')) {
      if (!linha.trim()) continue;
      const p = linha.split(/[;\t]/).map((x) => x.trim());
      const numero = numeroWa(p.length > 1 ? p[p.length - 1] : p[0]);
      if (!numero) { ruins.push(linha.trim()); continue; }
      cts.push({ nome: p.length > 1 ? p.slice(0, -1).join(' ') : '+' + numero, numero });
    }
    if (ruins.length) return modal({ titulo: 'Número inválido', corpo: `<p>Confira o DDD e o número destas linhas:</p><div class="small">${ruins.map((r) => '• ' + esc(r)).join('<br>')}</div>`, ok: 'Corrigir', cancelar: null });
    D().config.contatos = cts;
    D().config.whatsAuto = $('#cfWAuto').checked;
    DB.salvar(); toast(`${cts.length} contato(s) salvo(s)`); VIEWS.ajustes();
  },
  'salvar-cfg': () => {
    const linhas = (s) => $(s).value.split('\n').map((x) => x.trim()).filter(Boolean);
    const cfg = D().config;
    cfg.oficina = $('#cfOf').value.trim();
    cfg.turnos = linhas('#cfTur'); if (!cfg.turnos.length) cfg.turnos = ['Turno A', 'Turno B', 'Turno C'];
    cfg.equipe = linhas('#cfEq');
    cfg.cegas = $('#cfCegas').checked;
    DB.salvar(); toast('Ajustes salvos'); render();
  },
  entrar: () => entrar(),
  'modo-local': () => modal({ titulo: 'Usar sem nuvem?', corpo: '<p>Os dados ficarão só neste aparelho e não aparecem nos outros. Dá para entrar na conta depois, em Ajustes → Nuvem; o que estiver aqui sobe junto.</p>', ok: 'Usar sem nuvem',
    aoConfirmar() { try { localStorage.setItem('ferramentaria_modo', 'local'); } catch (e) {} render(); } }),
  'ir-login': () => { try { localStorage.removeItem('ferramentaria_modo'); } catch (e) {} render(); },
  'sinc-agora': async () => { await Nuvem.sincronizar(); toast(Nuvem.estado === 'ok' ? 'Sincronizado' : Nuvem.textoEstado()); VIEWS.ajustes(); },
  'sinc-info': () => toast(Nuvem.textoEstado()),
  'trocar-login': trocarLogin,
  sair: async () => {
    if (navigator.onLine) await Nuvem.sincronizar();
    const n = Nuvem.contarPendentes();
    modal({ titulo: 'Sair da conta neste aparelho?', perigo: true, ok: 'Sair',
      corpo: `<p>Os dados continuam salvos na nuvem; a cópia deste aparelho será apagada.</p>${n ? `<p style="color:var(--bad)"><b>Atenção:</b> ${n} alteração(ões) ainda não foram enviadas (sem internet?) e serão perdidas.</p>` : ''}${D().rascunho ? '<p>A conferência em andamento será descartada.</p>' : ''}`,
      aoConfirmar() { const disp = D().dispositivo; DB.dados = DB.vazio(); DB.dados.dispositivo = disp; DB.salvar(true); Nuvem.sair(); ir('inicio'); render(); } });
  },
  backup: () => baixar(`ferramentaria-backup-${hoje()}.json`, JSON.stringify(D(), null, 1), 'application/json'),
  restaurar: () => $('#arqBackup').click(),
  csv: exportarCSV,
  apagar: () => modal({ titulo: 'Apagar todos os dados?', corpo: '<p>Ferramentas, conferências e ajustes deste aparelho serão apagados. <b>Não dá para desfazer.</b> Exporte um backup antes.</p>', ok: 'Apagar tudo', perigo: true,
    aoConfirmar() { DB.dados = DB.vazio(); DB.salvar(); toast('Dados apagados'); ir('inicio'); render(); } })
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT' || el.closest('dialog')) return;
  const fn = ACOES[el.dataset.a];
  if (fn && SO_SUPERVISOR.has(el.dataset.a) && !supervisor()) { e.preventDefault(); return toast('Somente o supervisor pode fazer isso'); }
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.a === 'qtd') setContagem(e.target.closest('.cnt').dataset.item, e.target.value);
});
window.addEventListener('hashchange', render);

/* ---------- Início ---------- */
DB.carregar();
Nuvem.carregar();
render();
Nuvem.sincronizar();
window.addEventListener('online', () => Nuvem.sincronizar());
window.addEventListener('offline', () => { Nuvem.estado = 'offline'; Nuvem.mostrar(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Nuvem.sincronizar(); });
setInterval(() => { if (document.visibilityState === 'visible') Nuvem.sincronizar(); }, 60000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
